<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Réflexions</title>
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Réflexions">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23121212'/%3E%3Ccircle cx='50' cy='50' r='20' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Réflexions","short_name":"Réflexions","start_url":".","display":"standalone","background_color":"%23121212","theme_color":"%23121212","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23121212%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2720%27 fill=%27none%27 stroke=%27white%27 stroke-width=%276%27/%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<style>
:root{
  --bg:#121212; --surface:#1C1C1E; --surface-2:#202022; --surface-3:#242426;
  --text:#F2F2F0; --text-secondary:#B8B8BC; --text-muted:#8A8A8E; --text-faint:#5A5A5E;
  --border:#28282A; --border-strong:#333335;
  --danger:#FF6B6B;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;height:100%;}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body.no-scroll{overflow:hidden;position:fixed;inset:0;width:100%;}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
button,input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);}
button{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;}
button:active{opacity:.7;}
.btn-primary{background:var(--text);color:#121212;border-color:var(--text);font-weight:600;}
.btn-danger{background:var(--danger);color:#1B0000;border-color:var(--danger);}
.btn-ghost{background:transparent;border-color:transparent;}
input[type=text],input[type=url],textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);outline:none;}
textarea{resize:none;font-family:inherit;line-height:1.6;overflow:hidden;}
a{color:inherit;}
.wrap{max-width:480px;margin:0 auto;padding:70px 16px calc(120px + env(safe-area-inset-bottom));position:relative;min-height:100dvh;}
.icon{display:inline-flex;flex-shrink:0;}
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;}
.muted{color:var(--text-muted);}
.small{font-size:12px;}
.top-bar{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;display:flex;justify-content:flex-end;z-index:30;}
.round-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-secondary);}

.active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.active-filter-chip{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border-strong);font-size:13px;color:var(--text);}
.active-filter-chip .x{color:var(--text-muted);display:flex;}

.month-header{font-size:22px;font-weight:700;color:var(--text);margin:22px 4px 6px;}
.month-header:first-child{margin-top:2px;}
.note-row{position:relative;overflow:hidden;}
.note-row-swipe-bg{position:absolute;inset:0;display:flex;align-items:center;padding-left:14px;color:var(--text);background:var(--surface-3);opacity:0;border-radius:10px;}
.note-row-head{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);background:var(--bg);position:relative;touch-action:pan-y;}
.note-row-main{flex:1;min-width:0;}
.note-row-title-line{display:flex;align-items:center;gap:5px;}
.note-row-title{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-row-sub{font-size:14px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.note-row-sub .sep{margin:0 5px;color:var(--text-faint);}
.note-row-thumb{width:42px;height:42px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.note-row-thumb img,.note-row-thumb video{width:100%;height:100%;object-fit:cover;}
.pin-mark{color:var(--text-muted);flex-shrink:0;}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.type-mark{color:var(--text-faint);flex-shrink:0;display:flex;}
.note-row-expand{overflow:hidden;max-height:0;transition:max-height .28s cubic-bezier(.4,0,.2,1);border-bottom:1px solid var(--border);}
.note-row-expand-inner{padding:10px 2px 12px 24px;}
.media-broken{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:11px;text-align:center;padding:8px;}

.empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty p{margin:4px 0;font-size:13px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.overlay.center{align-items:center;padding:20px;}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;overscroll-behavior:contain;}
.overlay.center .sheet{border-radius:18px;max-height:82vh;}
.sheet-handle{width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 14px;}
.menu-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);color:var(--text);}
.menu-item:last-child{border-bottom:none;}
.menu-item.danger{color:var(--danger);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#121212;padding:10px 18px;border-radius:20px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;}
.toast.show{opacity:1;}
select{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);width:100%;}

.settings-group{margin-bottom:18px;}
.settings-group-label{font-size:14px;color:var(--text-secondary);font-weight:600;margin:0 0 8px 4px;}
.settings-group-box{background:var(--surface-2);border-radius:12px;padding:12px;}
.chips{display:flex;gap:10px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-secondary);font-size:15px;}
.chip.active{background:var(--text);color:#121212;border-color:var(--text);font-weight:600;}
.trash-link{display:block;text-align:center;font-size:13px;color:var(--text-muted);padding:10px;background:none;border:none;width:100%;}

.tag-popup{position:fixed;z-index:60;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:16px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.55);max-width:300px;}
.tag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.tag-bubble{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.icon-grid,.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;max-height:220px;overflow-y:auto;}
.icon-swatch{aspect-ratio:1/1;border-radius:12px;border:2px solid transparent;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.icon-swatch.selected{border-color:var(--text);}
.color-swatch{aspect-ratio:1/1;border-radius:12px;border:2px solid transparent;}
.color-swatch.selected{border-color:var(--text);}

.popup-anim{opacity:0;transform:scale(.92);transition:opacity .16s ease, transform .16s ease;}
.popup-anim.show{opacity:1;transform:scale(1);}
.ctx-popup{position:fixed;z-index:65;width:230px;}
.ctx-actions-row{display:flex;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:14px;padding:6px;margin-bottom:6px;}
.ctx-action{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;color:var(--text);}
.ctx-action.danger{color:var(--danger);}
.ctx-action span{font-size:11px;}
.ctx-list{background:var(--surface-3);border:1px solid var(--border-strong);border-radius:14px;overflow:hidden;}
.ctx-list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border-strong);color:var(--text);font-size:15px;}
.ctx-list-item:last-child{border-bottom:none;}

.bottom-bar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;display:flex;align-items:center;gap:8px;z-index:30;}
.search-bar{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:22px;padding:11px 16px;}
.search-bar input{border:none;background:transparent;padding:0;flex:1;outline:none;font-size:15px;}
.fab{width:46px;height:46px;border-radius:50%;background:var(--text);color:#121212;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 4px 16px rgba(0,0,0,.4);flex-shrink:0;transition:transform .2s;}
.fab.open{transform:rotate(45deg);}
.type-menu-backdrop{position:fixed;inset:0;background:rgba(10,10,10,0);backdrop-filter:blur(0px);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s, backdrop-filter .25s;}
.type-menu-backdrop.open{background:rgba(10,10,10,.55);backdrop-filter:blur(6px);opacity:1;pointer-events:auto;}
.type-menu{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);width:calc(100% - 32px);max-width:340px;background:var(--surface);border:1px solid var(--border-strong);border-radius:18px;padding:10px;z-index:36;opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;}
.type-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.type-menu-item{display:flex;align-items:center;gap:14px;padding:11px 8px;border-radius:12px;}
.type-menu-item:active{background:var(--surface-2);}
.type-bubble{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.composer{display:flex;flex-direction:column;min-height:40vh;}
.composer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.composer-body{flex:1;background:transparent;border:none;font-size:16px;line-height:1.6;padding:0;outline:none;resize:none;min-height:44px;max-height:50vh;overflow-y:auto;}
.block-chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:6px 10px;font-size:11px;color:var(--text-secondary);}
.toolbar{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:12px;margin-bottom:14px;}
.tool-icon{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex-shrink:0;}
.tool-icon.recording{background:var(--danger);border-color:var(--danger);color:#1B0000;}
.rec-overlay{display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 10px;}
.rec-wave{display:flex;align-items:center;gap:3px;height:60px;}
.rec-wave span{width:3px;background:var(--text);border-radius:2px;transition:height .05s;}
.rec-timer{font-size:24px;font-variant-numeric:tabular-nums;color:var(--text);}
.rec-stop-btn{width:56px;height:56px;border-radius:50%;background:var(--danger);border:none;display:flex;align-items:center;justify-content:center;color:#1B0000;}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
.toggle-track{width:36px;height:20px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);position:relative;flex-shrink:0;}
.toggle-thumb{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--text-muted);transition:left .15s;}
.toggle.on .toggle-track{background:var(--text);}
.toggle.on .toggle-thumb{left:17px;background:#121212;}

.note-excerpt{font-size:15px;color:var(--text);line-height:1.6;margin:0 0 8px;word-break:break-word;white-space:pre-wrap;}
.pill-player{background:var(--text);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pill-play{width:24px;height:24px;border-radius:50%;background:#121212;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;padding:0;}
.pill-wave{flex:1;display:flex;align-items:center;height:22px;min-width:0;}
.pill-wave span{flex:1;margin-right:2px;border-radius:1px;background:#B4B2A9;display:inline-block;}
.pill-wave span:last-child{margin-right:0;}
.pill-wave span.played{background:#121212;}
.thumb{border-radius:10px;overflow:hidden;background:var(--surface-2);width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;}
.link-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:9px 11px;margin:0 0 8px;text-decoration:none;color:var(--text-secondary);}
</style>
</head>

/* ---------- DATA / INDEXEDDB ---------- */
const DB_NAME='reflexions-db', DB_VERSION=2;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('categories')) db.createObjectStore('categories',{keyPath:'id'});
      if(!db.objectStoreNames.contains('notes')){
        const ns=db.createObjectStore('notes',{keyPath:'id'});
        ns.createIndex('categoryId','categoryId');
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function dbAll(store){ const db=await openDB(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readonly'); const r=t.objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
async function dbGet(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readonly'); const r=t.objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
async function dbPut(store,val){ const db=await openDB(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite'); t.objectStore(store).put(val); t.oncomplete=()=>res(val); t.onerror=()=>rej(t.error);}); }
async function dbDelete(store,id){ const db=await openDB(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite'); t.objectStore(store).delete(id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);}); }

async function ensureSeed(){
  const cats=await dbAll('categories');
  if(cats.length===0){
    for(let i=0;i<DEFAULT_CATEGORIES.length;i++){
      await dbPut('categories',{...DEFAULT_CATEGORIES[i],order:i,createdAt:new Date().toISOString()});
    }
  }
  await migrateNotesIfNeeded();
}
async function migrateNotesIfNeeded(){
  if(localStorage.getItem('reflexions-migrated-v2')) return;
  const notes=await dbAll('notes');
  for(const n of notes){
    if(n.voices || n.photos || n.links){ continue; }
    const updated={...n, voices:[], photos:[], links:[]};
    if(n.type==='voice' && n.mediaBlob){
      updated.voices=[{id:uid(), blob:n.mediaBlob, mimeType:n.mediaBlob.type, duration:n.duration||'', transcript:n.transcript||''}];
    } else if(n.type==='audio' && n.mediaBlob){
      updated.voices=[{id:uid(), blob:n.mediaBlob, mimeType:n.mediaBlob.type, duration:n.duration||'', transcript:''}];
    } else if((n.type==='photo'||n.type==='video') && n.mediaBlob){
      updated.photos=[{id:uid(), blob:n.mediaBlob, mimeType:n.mediaBlob.type}];
    } else if(n.type==='link' && n.linkUrl){
      updated.links=[{id:uid(), url:n.linkUrl}];
    }
    delete updated.mediaBlob; delete updated.type; delete updated.linkUrl; delete updated.duration; delete updated.transcript;
    await dbPut('notes',updated);
  }
  localStorage.setItem('reflexions-migrated-v2','1');
}

function formatDateFull(iso){
  const d=new Date(iso), now=new Date();
  const dd=d.getDate().toString().padStart(2,'0'), mm=(d.getMonth()+1).toString().padStart(2,'0');
  const hh=d.getHours().toString().padStart(2,'0'), min=d.getMinutes().toString().padStart(2,'0');
  const datePart = d.getFullYear()===now.getFullYear() ? `${dd}/${mm}` : `${dd}/${mm}/${d.getFullYear()}`;
  return `${datePart}, ${hh}:${min}`;
}
function monthLabel(iso){
  const d=new Date(iso), now=new Date();
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const label=months[d.getMonth()];
  return d.getFullYear()===now.getFullYear() ? label : `${label} ${d.getFullYear()}`;
}

async function extractPeaks(blob, samples=32){
  try{
    const arrBuf=await blob.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const audioBuf=await ctx.decodeAudioData(arrBuf.slice(0));
    const raw=audioBuf.getChannelData(0);
    const blockSize=Math.max(1,Math.floor(raw.length/samples));
    const peaks=[];
    for(let i=0;i<samples;i++){
      let sum=0, count=0;
      for(let j=0;j<blockSize;j++){ const idx=i*blockSize+j; if(idx<raw.length){ sum+=Math.abs(raw[idx]); count++; } }
      peaks.push(count?sum/count:0);
    }
    const max=Math.max(...peaks)||1;
    ctx.close();
    return peaks.map(p=>Math.max(0.08,p/max));
  }catch(e){
    return Array.from({length:samples}).map((_,i)=>0.2+((i*37)%60)/100);
  }
}

    if(state.categoryFilter.length && !state.categoryFilter.includes(n.categoryId)) return false;
    if(q){
      const hay=[n.customTitle,n.body,...(n.voices||[]).map(v=>v.transcript),...(n.links||[]).map(l=>l.url)].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(!!a.favorite!==!!b.favorite) return a.favorite? -1:1;
    return new Date(b.createdAt)-new Date(a.createdAt);
  });
}

function quickCaptureVoice(onSaved){
  const ov=document.createElement('div');
  ov.className='overlay center';
  ov.innerHTML=`<div class="sheet"><div class="rec-overlay">
    <div class="rec-wave" id="qv-wave">${Array.from({length:24}).map(()=>'<span style="height:6px"></span>').join('')}</div>
    <div class="rec-timer" id="qv-timer">0:00</div>
    <button class="rec-stop-btn" id="qv-stop">${icon('stop',20)}</button>
    <p class="small muted">Touche pour arrêter l'enregistrement</p>
  </div></div>`;
  document.body.appendChild(ov);
  lockScroll();

  let chunks=[], mediaRecorder, audioCtx, analyser, rafId, recStart=Date.now(), stream;
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    stream=s;
    const candidates=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
    let mimeType='';
    for(const c of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)){ mimeType=c; break; } }
    mediaRecorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable=(e)=>{ if(e.data.size>0) chunks.push(e.data); };
    mediaRecorder.start(); recStart=Date.now();
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=256;
    src.connect(analyser);
    animate();
  }).catch(()=>{ showToast('Micro non accessible sur cet appareil'); ov.remove(); unlockScroll(); });

  function animate(){
    if(!analyser) return;
    const data=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(data);
    const bars=ov.querySelectorAll('#qv-wave span');
    const step=Math.max(1,Math.floor(data.length/bars.length));
    bars.forEach((b,i)=>{ const v=Math.abs(data[i*step]-128)/128; b.style.height=(6+v*54)+'px'; });
    const timerEl=ov.querySelector('#qv-timer');
    if(timerEl){ const s=Math.floor((Date.now()-recStart)/1000); timerEl.textContent=Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0'); }
    rafId=requestAnimationFrame(animate);
  }
  ov.querySelector('#qv-stop').onclick=()=>{
    if(!mediaRecorder || mediaRecorder.state==='inactive'){ ov.remove(); unlockScroll(); return; }
    cancelAnimationFrame(rafId);
    const usedMime=mediaRecorder.mimeType;
    const durSec=Math.max(1,Math.round((Date.now()-recStart)/1000));
    mediaRecorder.onstop=async ()=>{
      const blob=new Blob(chunks,{type: usedMime || 'audio/webm'});
      const peaks=await extractPeaks(blob);
      const note={id:uid(), body:'', voices:[{id:uid(), blob, mimeType:blob.type, duration: Math.floor(durSec/60)+':'+(durSec%60).toString().padStart(2,'0'), transcript:'', peaks}], photos:[], links:[], categoryId:null, favorite:false, deleted:false, createdAt:new Date().toISOString()};
      await dbPut('notes',note);
      if(stream) stream.getTracks().forEach(t=>t.stop());
      if(audioCtx) audioCtx.close();
      ov.remove(); unlockScroll(); showToast('Note enregistrée'); onSaved();
    };
    mediaRecorder.stop();
  };
}

/* ---------- NOTE ROW ---------- */
function summarize(note){
  if(note.body) return note.body.replace(/\s+/g,' ').trim();
  if((note.voices||[]).length) return 'Note vocale · '+(note.voices[0].duration||'');
  if((note.photos||[]).length) return (note.photos||[]).some(p=>(p.mimeType||'').startsWith('video'))?'Vidéo':'Photo';
  if((note.links||[]).length){ let h=note.links[0].url; try{ h=new URL(note.links[0].url).hostname.replace('www.',''); }catch(e){} return h; }
  return '';
}
function titleLine(note){
  try{
    if(note.customTitle) return note.customTitle;
    if(note.body){ const first=note.body.split('\n')[0].trim(); return first || 'Note'; }
    if((note.voices||[]).length) return 'Note vocale';
    if((note.photos||[]).length) return (note.photos||[]).some(p=>(p.mimeType||'').startsWith('video'))?'Vidéo':'Photo';
    if((note.links||[]).length) return 'Lien';
    return 'Note';
  }catch(e){ return note.customTitle || 'Note'; }
}
function typeIconFor(note){
  if((note.voices||[]).length) return 'mic';
  if((note.photos||[]).length) return (note.photos||[]).some(p=>(p.mimeType||'').startsWith('video'))?'video':'photo';
  if((note.links||[]).length) return 'link';
  return null;
}
function expandedContentHTML(note){
  let html='<div class="note-row-expand-inner">';
  if(note.body) html+=`<p class="note-excerpt">${escapeHtml(note.body)}</p>`;
  (note.voices||[]).forEach((v,i)=>{
    let barsHtml='';
    const peaks=v.peaks && v.peaks.length ? v.peaks : Array.from({length:28}).map((_,b)=>0.2+((b*29)%60)/100);
    peaks.forEach(p=>{ barsHtml+=`<span style="height:${Math.round(4+p*26)}px"></span>`; });
    html+=`<div class="pill-player" data-audio="${note.id}:${i}">
      <button class="pill-play" data-play="${note.id}:${i}">${icon('play',11)}</button>
      <div class="pill-wave" data-wave="${note.id}:${i}">${barsHtml}</div>
      <span class="small" style="color:#5F5E5A;">${v.duration||''}</span>
    </div>`;
    if(v.transcript){
      const shown=state.showTranscript.has(note.id+':'+i);
      html+=`<div class="row gap8" style="margin:0 0 6px;">
        <div class="toggle ${shown?'on':''}" data-transcript-toggle="${note.id}:${i}"><div class="toggle-track"><div class="toggle-thumb"></div></div></div>
        <span class="small muted">Transcription</span>
      </div>`;
      if(shown) html+=`<p class="small muted" style="margin:-2px 0 8px;">${escapeHtml(v.transcript)}</p>`;
    }
  });
  (note.photos||[]).forEach((p,i)=>{ html+=`<div class="thumb" data-media="${note.id}:${i}"></div>`; });
  (note.links||[]).forEach(l=>{
    let host=l.url; try{ host=new URL(l.url).hostname.replace('www.',''); }catch(e){}
    html+=`<a class="link-box" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${icon('link',14)}<span class="small">${escapeHtml(host)}</span></a>`;
  });
  html+='</div>';
  return html;
}
function noteRowHTML(note, cat){
  const hasThumb=(note.photos||[]).length>0;
  const isOpen=state.expandedIds.has(note.id);
  const tIcon=typeIconFor(note);
  return `
  <div class="note-row" data-note="${note.id}">
    <div class="note-row-swipe-bg" data-swipe-bg="${note.id}">${icon('pin',18)}</div>
    <div class="note-row-head" data-toggle="${note.id}">
      ${note.favorite?`<span class="pin-mark">${icon('pin',14)}</span>`:''}
      ${cat?`<span class="cat-dot" style="background:${cat.accent}"></span>`:''}
      <div class="note-row-main">
        <div class="note-row-title-line">
          ${tIcon?`<span class="type-mark">${icon(tIcon,13)}</span>`:''}
          <span class="note-row-title">${escapeHtml(titleLine(note))}</span>
        </div>
        <div class="note-row-sub">${formatDateFull(note.createdAt)}<span class="sep">·</span>${escapeHtml(summarize(note).slice(0,50))}</div>
      </div>
      ${hasThumb?`<div class="note-row-thumb" data-media-thumb="${note.id}:0"></div>`:''}
    </div>
    <div class="note-row-expand" data-expand="${note.id}">${isOpen?expandedContentHTML(note):''}</div>
  </div>`;
}
async function fillOneMedia(el, isThumb){
  const attr = isThumb ? el.dataset.mediaThumb : el.dataset.media;
  const [noteId,idx]=attr.split(':');
  try{
    const note=await dbGet('notes',noteId);
    const p=note.photos[idx];
    if(!p || !(p.blob instanceof Blob)) throw new Error('missing blob');
    const url=URL.createObjectURL(p.blob);
    if((p.mimeType||'').startsWith('video')) el.innerHTML=`<video src="${url}" ${isThumb?'muted playsinline':'controls playsinline'}></video>`;
    else el.innerHTML=`<img src="${url}" alt="">`;
  }catch(e){
    el.innerHTML=`<div class="media-broken">Média indisponible</div>`;
  }
}
function fillThumbs(container){
  container.querySelectorAll('[data-media-thumb]').forEach(el=>fillOneMedia(el,true));
  container.querySelectorAll('[data-media]').forEach(el=>fillOneMedia(el,false));
}
function bindPlayButtons(container){
  container.querySelectorAll('[data-play]').forEach(el=>{
    if(el._bound) return; el._bound=true;
    el.addEventListener('click',async (e)=>{
      e.stopPropagation();
      const [noteId,idx]=el.dataset.play.split(':');
      const note=await dbGet('notes',noteId);
      const v=note.voices[idx];
      if(!v || !(v.blob instanceof Blob)){ showToast('Média indisponible'); return; }
      const waveEl=container.querySelector(`[data-wave="${noteId}:${idx}"]`);
      const bars=waveEl?waveEl.querySelectorAll('span'):[];
      let audio=el._audio;
      if(!audio){
        audio=new Audio(URL.createObjectURL(v.blob));
        el._audio=audio;
        audio.addEventListener('timeupdate',()=>{
          if(!audio.duration) return;
          const playedCount=Math.round((audio.currentTime/audio.duration)*bars.length);
          bars.forEach((b,bi)=>b.classList.toggle('played', bi<playedCount));
        });
        audio.addEventListener('ended',()=>{ el.innerHTML=icon('play',11); bars.forEach(b=>b.classList.remove('played')); if(currentAudio===audio){currentAudio=null;currentAudioBtn=null;} });
      }
      if(audio.paused){
        stopCurrentAudio();
        audio.play(); el.innerHTML=icon('pause',11);
        currentAudio=audio; currentAudioBtn=el;
      } else {
        audio.pause(); el.innerHTML=icon('play',11);
        currentAudio=null; currentAudioBtn=null;
      }
    });
  });
}

function bindNoteRowEvents(container, allNotes, cats, catById, refresh){
  fillThumbs(container);
  bindPlayButtons(container);
  container.querySelectorAll('[data-transcript-toggle]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const key=el.dataset.transcriptToggle;
      if(state.showTranscript.has(key)) state.showTranscript.delete(key); else state.showTranscript.add(key);
      const noteId=key.split(':')[0];
      const row=container.querySelector(`.note-row[data-note="${noteId}"]`);
      const note=allNotes.find(n=>n.id===noteId);
      if(row && note){
        const expandEl=row.querySelector('[data-expand]');
        expandEl.innerHTML=expandedContentHTML(note);
        fillThumbs(expandEl); bindPlayButtons(expandEl); bindTranscriptToggles(expandEl);
        expandEl.style.maxHeight=expandEl.scrollHeight+'px';
      }
    });
  });
  function bindTranscriptToggles(scope){
    scope.querySelectorAll('[data-transcript-toggle]').forEach(el=>{
      if(el._bound) return; el._bound=true;
      el.addEventListener('click',(e)=>{
        e.stopPropagation();
        const key=el.dataset.transcriptToggle;
        if(state.showTranscript.has(key)) state.showTranscript.delete(key); else state.showTranscript.add(key);
        const noteId=key.split(':')[0];
        const row=scope.closest('.note-row');
        const note=allNotes.find(n=>n.id===noteId);
        const expandEl=row.querySelector('[data-expand]');
        expandEl.innerHTML=expandedContentHTML(note);
        fillThumbs(expandEl); bindPlayButtons(expandEl); bindTranscriptToggles(expandEl);
        expandEl.style.maxHeight=expandEl.scrollHeight+'px';
      });
    });
  }

  container.querySelectorAll('[data-toggle]').forEach(head=>{
    const row=head.closest('.note-row');
    const id=row.dataset.note;
    const expandEl=row.querySelector('[data-expand]');
    const swipeBg=row.querySelector('[data-swipe-bg]');
    let pressTimer=null, startX=0, startY=0, moved=false, longFired=false, swiping=false, dx=0;

    const start=(e)=>{
      const pt=e.touches?e.touches[0]:e;
      startX=pt.clientX; startY=pt.clientY; moved=false; longFired=false; swiping=false; dx=0;
      pressTimer=setTimeout(()=>{
        longFired=true;
        navigator.vibrate && navigator.vibrate(15);
        openNoteContextMenu(id, cats, row, refresh);
      },420);
    };
    const move=(e)=>{
      const pt=e.touches?e.touches[0]:e;
      dx=pt.clientX-startX; const dy=pt.clientY-startY;
      if(!swiping && Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.5){
        swiping=true; clearTimeout(pressTimer);
      }
      if(swiping && dx>0){
        head.style.transform=`translateX(${Math.min(dx,90)}px)`;
        if(swipeBg) swipeBg.style.opacity=Math.min(dx/90,1);
      } else if(Math.abs(dx)>10 || Math.abs(dy)>10){
        moved=true; clearTimeout(pressTimer);
      }
    };
    const end=async ()=>{
      clearTimeout(pressTimer);
      if(swiping){
        head.style.transition='transform .2s ease';
        head.style.transform='translateX(0)';
        if(swipeBg){ swipeBg.style.transition='opacity .2s ease'; swipeBg.style.opacity='0'; }
        setTimeout(()=>{ head.style.transition=''; if(swipeBg) swipeBg.style.transition=''; },220);
        if(dx>70){
          const note=await dbGet('notes',id);
          note.favorite=!note.favorite;
          await dbPut('notes',note);
          showToast(note.favorite?'Note épinglée':'Note désépinglée');
          refresh();
        }
        return;
      }
      if(!moved && !longFired){
        stopCurrentAudio();
        const note=allNotes.find(n=>n.id===id);
        const isOpen=state.expandedIds.has(id);
        if(isOpen){
          state.expandedIds.delete(id);
          expandEl.style.maxHeight=expandEl.scrollHeight+'px';
          requestAnimationFrame(()=>{ expandEl.style.maxHeight='0px'; });
        } else {
          state.expandedIds.add(id);
          expandEl.innerHTML=expandedContentHTML(note);
          fillThumbs(expandEl); bindPlayButtons(expandEl); bindTranscriptToggles(expandEl);
          expandEl.style.maxHeight='0px';
          requestAnimationFrame(()=>{ expandEl.style.maxHeight=expandEl.scrollHeight+'px'; });
        }
      }
    };
    head.addEventListener('touchstart',start,{passive:true});
    head.addEventListener('touchmove',move,{passive:true});
    head.addEventListener('touchend',end);
    head.addEventListener('mousedown',start);
    head.addEventListener('mousemove',move);
    head.addEventListener('mouseup',end);
    head.addEventListener('contextmenu',(e)=>e.preventDefault());
  });
}

/* ---------- CONTEXT MENU ---------- */
function showPopup(pop){
  document.body.appendChild(pop);
  pop.classList.add('popup-anim');
  requestAnimationFrame(()=>pop.classList.add('show'));
}
function openNoteContextMenu(noteId, cats, anchorEl, refresh){
  document.querySelectorAll('.ctx-popup,.tag-popup').forEach(el=>el.remove());
  const rect=anchorEl.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='ctx-popup';
  let top=rect.top-220; if(top<10) top=rect.bottom+8;
  pop.style.top=Math.max(10,Math.min(window.innerHeight-330,top))+'px';
  pop.style.left=Math.min(window.innerWidth-244, Math.max(10,rect.left))+'px';
  pop.innerHTML=`
    <div class="ctx-actions-row">
      <div class="ctx-action" data-act="share">${icon('share',19)}<span>Partager</span></div>
      <div class="ctx-action" data-act="move">${icon('move',19)}<span>Déplacer</span></div>
      <div class="ctx-action danger" data-act="delete">${icon('trash',19)}<span>Supprimer</span></div>
    </div>
    <div class="ctx-list">
      <div class="ctx-list-item" data-act="pin"><span id="pin-label">Épingler la note</span>${icon('pin',16)}</div>
      <div class="ctx-list-item" data-act="edit"><span>Modifier</span>${icon('edit',16)}</div>
      <div class="ctx-list-item" data-act="title"><span>Modifier le titre</span>${icon('edit',16)}</div>
      <div class="ctx-list-item" data-act="duplicate"><span>Dupliquer la note</span>${icon('copy',16)}</div>
    </div>`;
  showPopup(pop);
  function cleanup(){ pop.classList.remove('show'); setTimeout(()=>pop.remove(),140); document.removeEventListener('click',outside,true); }
  function outside(e){ if(!pop.contains(e.target)) cleanup(); }
  setTimeout(()=>document.addEventListener('click',outside,true),80);

  dbGet('notes',noteId).then(note=>{
    if(note && note.favorite){ const l=pop.querySelector('#pin-label'); if(l) l.textContent='Désépingler la note'; }
  });

  pop.querySelector('[data-act="share"]').onclick=async ()=>{
    cleanup();
    const note=await dbGet('notes',noteId);
    const text=[note.customTitle,note.body,...(note.voices||[]).map(v=>v.transcript),...(note.links||[]).map(l=>l.url)].filter(Boolean).join(' — ');
    if(navigator.share){ try{ await navigator.share({text}); }catch(e){} }
    else { await navigator.clipboard.writeText(text); showToast('Copié dans le presse-papiers'); }
  };
  pop.querySelector('[data-act="move"]').onclick=()=>{ cleanup(); openTagPopup(noteId, cats, anchorEl, refresh); };
  pop.querySelector('[data-act="delete"]').onclick=async ()=>{
    cleanup();
    const ok=await confirmDialog('Supprimer cette note','Elle sera déplacée dans les notes supprimées, et restera récupérable.','Supprimer');
    if(!ok) return;
    const note=await dbGet('notes',noteId);
    note.deleted=true;
    await dbPut('notes',note);
    showToast('Note déplacée dans les notes supprimées'); refresh();
  };
  pop.querySelector('[data-act="pin"]').onclick=async ()=>{
    cleanup();
    const note=await dbGet('notes',noteId);
    note.favorite=!note.favorite;
    await dbPut('notes',note);
    showToast(note.favorite?'Note épinglée':'Note désépinglée'); refresh();
  };
  pop.querySelector('[data-act="edit"]').onclick=()=>{ cleanup(); openComposer(noteId, cats, refresh, true); };
  pop.querySelector('[data-act="title"]').onclick=async ()=>{
    cleanup();
    const note=await dbGet('notes',noteId);
    const t=await promptSheet('Titre de la note', note.customTitle||'', 'Titre');
    if(t===null) return;
    note.customTitle=t;
    await dbPut('notes',note);
    showToast('Titre modifié'); refresh();
  };
  pop.querySelector('[data-act="duplicate"]').onclick=async ()=>{
    cleanup();
    const note=await dbGet('notes',noteId);
    const copy={...note, id:uid(), createdAt:new Date().toISOString(), favorite:false,
      voices:(note.voices||[]).map(v=>({...v})), photos:(note.photos||[]).map(p=>({...p})), links:(note.links||[]).map(l=>({...l}))};
    await dbPut('notes',copy); showToast('Note dupliquée'); refresh();
  };
}

/* ---------- TRASH ---------- */
async function openTrash(refresh){
  const notes=(await dbAll('notes')).filter(n=>n.deleted).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const ov=openSheet(`
    <p style="font-size:15px;font-weight:600;margin:0 0 14px;">Notes supprimées</p>
    <div id="trash-list"></div>
  `,{center:true});
  const list=ov.querySelector('#trash-list');
  function draw(items){
    if(items.length===0){ list.innerHTML=`<p class="small muted" style="text-align:center;padding:20px;">Aucune note supprimée.</p>`; return; }
    list.innerHTML=items.map(n=>`
      <div class="menu-item" style="align-items:flex-start;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(titleLine(n))}</div>
          <div class="small muted">${formatDateFull(n.createdAt)}</div>
        </div>
        <button data-restore="${n.id}" style="flex-shrink:0;">${icon('restore',14)} Restaurer</button>
        <span data-hard-delete="${n.id}" style="color:var(--danger);flex-shrink:0;padding:8px;">${icon('trash',16)}</span>
      </div>`).join('');
    list.querySelectorAll('[data-restore]').forEach(el=>{
      el.onclick=async ()=>{
        const note=await dbGet('notes',el.dataset.restore);
        if(!note){ showToast('Note introuvable'); return; }
        note.deleted=false;
        await dbPut('notes',note);
        showToast('Note restaurée');
        const remaining=(await dbAll('notes')).filter(n=>n.deleted).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
        draw(remaining); refresh();
      };
    });
    list.querySelectorAll('[data-hard-delete]').forEach(el=>{
      el.onclick=async ()=>{
        const ok=await confirmDialog('Supprimer définitivement','Cette note sera effacée pour toujours.','Supprimer');
        if(!ok) return;
        await dbDelete('notes',el.dataset.hardDelete);
        showToast('Note effacée définitivement');
        const remaining=(await dbAll('notes')).filter(n=>n.deleted).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
        draw(remaining); refresh();
      };
    });
  }
  draw(notes);
}

    ${isNew?'':'<button class="btn-danger" id="cat-delete" style="width:100%;">Supprimer la catégorie</button>'}
  `,{center:true});
  ov.querySelectorAll('[data-icon]').forEach(el=>el.addEventListener('click',()=>{ draft.icon=el.dataset.icon; ov.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x===el)); }));
  ov.querySelectorAll('[data-color]').forEach(el=>el.addEventListener('click',()=>{
    const c=COLOR_BANK[el.dataset.color]; draft.tint=c.tint; draft.accent=c.accent;
    ov.querySelectorAll('[data-color]').forEach(x=>{ x.classList.remove('selected'); x.style.borderColor='transparent'; });
    el.classList.add('selected'); el.style.borderColor=c.accent;
  }));
  ov.querySelector('#cat-save').onclick=async ()=>{
    const name=ov.querySelector('#cat-name').value.trim();
    if(!name){ showToast('Donne un nom à la catégorie'); return; }
    const existing=cat || {order:(await dbAll('categories')).length, createdAt:new Date().toISOString()};
    await dbPut('categories',{...existing, id:draft.id, name, icon:draft.icon, tint:draft.tint, accent:draft.accent});
    closeOverlay(); showToast(isNew?'Catégorie créée':'Catégorie modifiée'); refresh();
  };
  if(!isNew){
    ov.querySelector('#cat-delete').onclick=async ()=>{
      closeOverlay();
      const ok=await confirmDialog('Supprimer cette catégorie', `« ${cat.name} » sera supprimée. Les notes concernées ne seront pas supprimées : elles redeviendront non classées.`, 'Supprimer');
      if(!ok) return;
      const notes=await dbAll('notes');
      for(const n of notes){ if(n.categoryId===cat.id){ n.categoryId=null; await dbPut('notes',n); } }
      await dbDelete('categories',cat.id);
      showToast('Catégorie supprimée'); refresh();
    };
  }
}

/* ---------- COMPOSER ---------- */
async function openComposer(noteId, cats, onSaved, isEdit){
  stopCurrentAudio();
  const existing = noteId ? await dbGet('notes', noteId) : null;
  const draft = existing ? { ...existing } : { id:uid(), body:'', voices:[], photos:[], links:[], categoryId:null, favorite:false, deleted:false, createdAt:new Date().toISOString() };
  if(existing){ draft.voices=(existing.voices||[]).map(v=>({...v})); draft.photos=(existing.photos||[]).map(p=>({...p})); draft.links=(existing.links||[]).map(l=>({...l})); }

  let transcriptionOn=true;

  document.querySelector('.overlay')?.remove();
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="sheet" style="border-radius:20px 20px 0 0;">
    <div class="composer">
      <div class="composer-top">
        <span id="cmp-close" class="btn-ghost" style="padding:6px;">${icon('close',18)}</span>
        <span class="small muted">${isEdit?'Modifier la note':'Nouvelle note'}</span>
        <span style="width:18px;"></span>
      </div>
      <textarea id="cmp-body" class="composer-body" placeholder="Écris ta réflexion…" rows="1">${escapeHtml(draft.body||'')}</textarea>
      <div id="cmp-chips" class="row" style="gap:8px;flex-wrap:wrap;margin:0 0 10px;"></div>
      <div class="toolbar">
        <button class="tool-icon" id="tool-mic">${icon('mic',17)}</button>
        <button class="tool-icon" id="tool-photo">${icon('photo',17)}</button>
        <button class="tool-icon" id="tool-link">${icon('link',17)}</button>
        <span style="flex:1;"></span>
        <div class="toggle ${transcriptionOn?'on':''}" id="transcript-toggle" title="Transcrire les vocaux">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
        <span class="small muted">Transcrire</span>
      </div>
      <button class="btn-primary" id="cmp-save" style="width:100%;">${isEdit?'Confirmer la modification':'Enregistrer la note'}</button>
      <input type="file" id="cmp-file-photo" accept="image/*" multiple style="display:none;">
    </div>
  </div>`;
  document.body.appendChild(ov);
  lockScroll();

  const bodyEl=ov.querySelector('#cmp-body');
  function autoGrow(){ bodyEl.style.height='auto'; bodyEl.style.height=Math.min(bodyEl.scrollHeight,window.innerHeight*0.5)+'px'; }
  bodyEl.addEventListener('input',autoGrow);
  setTimeout(autoGrow,0);
  setTimeout(()=>bodyEl.focus(),150);

  const chipsWrap=ov.querySelector('#cmp-chips');
  function renderChips(){
    let html='';
    draft.voices.forEach((v,i)=>{ html+=`<div class="block-chip" data-remove-voice="${i}">${icon('mic',13)}<span>Vocal ${v.duration||''}</span>${icon('close',11)}</div>`; });
    draft.photos.forEach((p,i)=>{ html+=`<div class="block-chip" data-remove-photo="${i}">${icon((p.mimeType||'').startsWith('video')?'video':'photo',13)}<span>${(p.mimeType||'').startsWith('video')?'Vidéo':'Photo'}</span>${icon('close',11)}</div>`; });
    draft.links.forEach((l,i)=>{
      let host=l.url; try{ host=new URL(l.url).hostname.replace('www.',''); }catch(e){}
      html+=`<div class="block-chip" data-remove-link="${i}">${icon('link',13)}<span>${escapeHtml(host)}</span>${icon('close',11)}</div>`;
    });
    chipsWrap.innerHTML=html;
    chipsWrap.querySelectorAll('[data-remove-voice]').forEach(el=>el.addEventListener('click',()=>{ draft.voices.splice(el.dataset.removeVoice,1); renderChips(); }));
    chipsWrap.querySelectorAll('[data-remove-photo]').forEach(el=>el.addEventListener('click',()=>{ draft.photos.splice(el.dataset.removePhoto,1); renderChips(); }));
    chipsWrap.querySelectorAll('[data-remove-link]').forEach(el=>el.addEventListener('click',()=>{ draft.links.splice(el.dataset.removeLink,1); renderChips(); }));
  }
  renderChips();

  ov.querySelector('#cmp-close').onclick=()=>{ ov.remove(); unlockScroll(); };
  ov.querySelector('#transcript-toggle').addEventListener('click',(e)=>{ transcriptionOn=!transcriptionOn; e.currentTarget.classList.toggle('on',transcriptionOn); });

  ov.querySelector('#tool-link').onclick=async ()=>{
    const url=await promptSheet('Nouveau lien','','https://…');
    if(url){ draft.links.push({id:uid(),url}); renderChips(); }
  };
  const filePhoto=ov.querySelector('#cmp-file-photo');
  ov.querySelector('#tool-photo').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change',(e)=>{ Array.from(e.target.files).forEach(file=>draft.photos.push({id:uid(), blob:file, mimeType:file.type})); renderChips(); });

  const micBtn=ov.querySelector('#tool-mic');
  let recording=false, mediaRecorder=null, chunks=[], audioCtx=null, analyser=null, rafId=null, recStart=0, stream=null, speechRec=null, liveTranscript='';
  async function startRecording(){
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(err){ showToast('Micro non accessible sur cet appareil'); return; }
    recording=true;
    micBtn.classList.add('recording'); micBtn.innerHTML=icon('stop',15);
    chunks=[]; liveTranscript='';
    const candidates=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
    let mimeType='';
    for(const c of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)){ mimeType=c; break; } }
    mediaRecorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable=(e)=>{ if(e.data.size>0) chunks.push(e.data); };
    mediaRecorder.start(); recStart=Date.now();
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=256;
    src.connect(analyser);
    if(transcriptionOn){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(SR){
        speechRec=new SR(); speechRec.lang='fr-FR'; speechRec.continuous=true; speechRec.interimResults=false;
        speechRec.onresult=(e)=>{ for(let i=e.resultIndex;i<e.results.length;i++){ liveTranscript+=e.results[i][0].transcript+' '; } };
        try{ speechRec.start(); }catch(e){}
      }
    }
  }
  function stopRecording(){
    if(!mediaRecorder || mediaRecorder.state==='inactive') return;
    recording=false;
    micBtn.classList.remove('recording'); micBtn.innerHTML=icon('mic',17);
    const usedMime=mediaRecorder.mimeType;
    const durSec=Math.max(1,Math.round((Date.now()-recStart)/1000));
    mediaRecorder.onstop=async ()=>{
      const blob=new Blob(chunks,{type: usedMime || 'audio/webm'});
      const peaks=await extractPeaks(blob);
      draft.voices.push({id:uid(), blob, mimeType:blob.type, duration: Math.floor(durSec/60)+':'+(durSec%60).toString().padStart(2,'0'), transcript: liveTranscript.trim(), peaks});
      renderChips();
    };
    mediaRecorder.stop();
    if(speechRec){ try{ speechRec.stop(); }catch(e){} speechRec=null; }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    if(audioCtx){ audioCtx.close(); audioCtx=null; }
  }
  micBtn.addEventListener('click',()=>{ if(recording) stopRecording(); else startRecording(); });

  ov.querySelector('#cmp-save').onclick=async ()=>{
    draft.body=bodyEl.value.trim();
    if(!draft.body && draft.voices.length===0 && draft.photos.length===0 && draft.links.length===0){
      showToast('Ajoute au moins un contenu avant d\u2019enregistrer'); return;
    }
    await dbPut('notes',draft);
    ov.remove(); unlockScroll(); showToast(isEdit?'Note modifiée':'Note enregistrée'); onSaved();
  };
}

/* ---------- SERVICE WORKER ---------- */
function registerSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
    navigator.serviceWorker.getRegistration().then(reg=>{ if(reg) reg.update(); });
  }
}
